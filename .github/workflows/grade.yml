name: Grade exercise

on:
  push:
    branches:
      - 'exercise/**'
  pull_request:
    branches:
      - main

jobs:
  visible-tests:
    name: Visible tests (mvn test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run visible tests
        run: mvn -B test
      - name: Upload surefire reports (visible)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-visible-${{ github.run_id }}
          path: target/surefire-reports/

  grading:
    name: Hidden grading suite
    runs-on: ubuntu-latest
    needs: visible-tests
    if: always() && (github.event_name == 'push' || github.event_name == 'pull_request')
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Detect branch
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${GITHUB_REF##*/}"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "→ grading branch: $BRANCH"
      - name: Run grading suite
        id: grade
        continue-on-error: true
        run: |
          chmod +x grading/run-grading.sh grading/scripts/*.sh
          ./grading/run-grading.sh "${{ steps.branch.outputs.branch }}"
      - name: Show grading result
        if: always()
        run: |
          if [ -f grading-result.json ]; then
            cat grading-result.json
          else
            echo '{"status":"no-result"}' | tee grading-result.json
          fi
      - name: Upload grading artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grading-result-${{ github.run_id }}
          path: |
            grading-result.json
            target/surefire-reports/
      - name: Comment on PR with grading result
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '### Grading result\n\n';
            try {
              const r = JSON.parse(fs.readFileSync('grading-result.json', 'utf8'));
              const emoji = r.status === 'passed' ? '✅' : '❌';
              body += `${emoji} **${r.status.toUpperCase()}** on branch \`${r.branch}\`\n\n`;
              body += `| total | passed | failures | errors | skipped |\n`;
              body += `| --- | --- | --- | --- | --- |\n`;
              body += `| ${r.total} | ${r.passed} | ${r.failures} | ${r.errors} | ${r.skipped} |\n`;
            } catch (e) {
              body += '⚠️ no grading-result.json found';
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });
      - name: POST grading result to webhook (optional)
        if: always()
        env:
          EVAL_WEBHOOK_URL: ${{ secrets.EVAL_WEBHOOK_URL }}
        run: |
          if [ -z "${EVAL_WEBHOOK_URL:-}" ]; then
            echo "EVAL_WEBHOOK_URL not set — skipping progress webhook"
            exit 0
          fi
          if [ -f grading-result.json ]; then
            curl -fsS -X POST "$EVAL_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d @grading-result.json || echo "webhook POST failed (non-fatal)"
          fi
      - name: Fail job if grading failed
        if: steps.grade.outcome != 'success'
        run: exit 1
